name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Generate signing key
        run: |
          rm -f app/lumen-release.jks
          keytool -genkeypair -v \
          -keystore app/lumen-release.jks \
          -alias lumen \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass mysecretpassword123 \
          -keypass mysecretpassword123 \
          -dname "CN=lumen, O=lumen, L=lumen, ST=lumen, C=US"
      - name: Build
        run: |
          ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/lumen-release.jks
          LUMEN_KEYSTORE_PATH: ${{ github.workspace }}/app/lumen-release.jks
          KEYSTORE_PASSWORD: mysecretpassword123
          LUMEN_KEYSTORE_PASSWORD: mysecretpassword123
          KEY_PASSWORD: mysecretpassword123
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
