name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Restore signing key
        run: |
          echo $LUMEN_KEYSTORE_B64 | base64 -d > app/lumen-release.jks
      - name: Build
        run: |
          ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/lumen-release.jks
          LUMEN_KEYSTORE_PATH: ${{ github.workspace }}/app/lumen-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
